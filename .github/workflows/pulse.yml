name: pulse

# The Pulse tests read these YAML files as well as www/: the whole packages/ and views/
# directories, the dashboards and scenes.yaml. Keep the filters in step with the test.
# This is the PR check; pushes to main run the tests in deploy.yml.
on:
  pull_request:
    paths:
      - 'www/**'
      - 'tests/**'
      - 'info_templates.yaml'
      - 'info-dashboard.yaml'
      - 'wallboard.yaml'
      - 'dashboard.yaml'
      - 'scenes.yaml'
      - 'views/**'
      - 'packages/**'
      - '.github/workflows/pulse.yml'

permissions:
  contents: read

# Cancel superseded runs on the same PR.
concurrency:
  group: pulse-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: npm test
        working-directory: tests
