# "Pulse": information-first dashboard. Home Assistant is a read-only consumer of the homerun
# event stream here: no MQTT publishes, no service calls to homerun.
# Write paths (all from the dashboard, nothing else): scene.turn_on, light.turn_on/turn_off,
# switch.turn_on/turn_off, media_player.media_play_pause/volume_set/turn_on/turn_off, and
# input_boolean.turn_on/turn_off on existing automation-enabled helpers, and on the House page
# input_select.select_option (mode modifier) and input_number.set_value (vacation threshold, global temperatures, window grace), each to a fixed helper. The list is enforced in
# www/pulse-card.js (ALLOWED); anything else throws. The Cameras page also embeds the existing
# custom:camera-events-card (variant: pulse), which makes its own button.press (pan/tilt) and Frigate
# media_source calls; those are not Pulse write paths.
# Mobile (/mobile-dashboard) and the wallboard are untouched and linked from Now.
streamline_templates: !include info_templates.yaml

views:
  - !include views/info-now.yaml
  - !include views/info-energy.yaml
  - !include views/info-house.yaml
  - !include views/info-cameras.yaml
  - !include views/info-room-parlour.yaml
  - !include views/info-room-kitchen.yaml
  - !include views/info-room-hallway_downstairs.yaml
  - !include views/info-room-hallway_upstairs.yaml
  - !include views/info-room-bedroom.yaml
  - !include views/info-room-bathroom.yaml
  - !include views/info-room-home_office.yaml
  - !include views/info-room-foreign_office.yaml
  - !include views/info-room-back_garden.yaml
  - !include views/info-room-front_garden.yaml
  # The phase 1 markdown views stay reachable until the owner removes them.
  - !include views/info-classic-now.yaml
  - !include views/info-classic-house.yaml
