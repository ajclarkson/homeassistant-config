# pulse-card.js is loaded through the fixed pulse-card-loader.js, which fetches the card with
# revalidation, so card changes need no ?v= bump and no HA restart: wait ~60 s for www-sync, then
# reopen the dashboard. Changing the loader or this list still needs an HA restart (HA reads
# extra_module_url at startup only).
frontend:
  themes: !include_dir_merge_named /config/themes
  extra_module_url:
    - /hacsfiles/material-you-utilities/material-you-utilities.min.js
    - /local/mo-timeline-card.js
    - /local/pulse-card-loader.js

panel_custom:
  - name: material-you-panel
    url_path: material-you-configuration
    sidebar_title: Material You Utilities
    sidebar_icon: mdi:material-design
    module_url: /hacsfiles/material-you-utilities/material-you-utilities.min.js
