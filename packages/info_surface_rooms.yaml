# Info surface ("Pulse" dashboard): per-room status reports, hold reasons and attention list.
#
# `sensor.info_rooms`      one entry per room in attribute `rooms`: occupancy, climate, lights,
#                          heating, automation flags, `holds` (every reason currently true),
#                          `reason_text`, last meaningful decision and a one-line `verdict`.
# `sensor.info_attention`  state = number of exceptions, attribute `items` = [{room, key, kind, text, nav}].
#                          Each kind is flagged only after its state has held past a duration (thresholds at the top of
#                          `info_attention_calc`; the stale limit in `info_stale_sensors`).
#
# The room table below is the single definition of rooms and hold reasons. Hold reasons are
# seeded from the `presence_section` config in views/*.yaml (reason_N_*) and extended with the
# `heating_hold_entity` window/door groups. They are listed here, not capped at two.
# The presence override helper itself is not a reason: it is reported separately
# (`override`), and "Override on (no active reason)" is shown when it is on and no reason is true.
#
# Attributes are emitted as JSON; consumers coerce with `x | from_json if x is string else x`
# because HA parses JSON containing true/false/null to a string, other JSON to a list.
template:
  - sensor:
      - name: Info Rooms
        unique_id: info_rooms
        icon: mdi:home-search-outline
        state: "ok"
        attributes:
          rooms: >-
            {# hold = [subsystem, entity, state that means "holding", label] #}
            {% set cfg = [
              {'k': 'parlour', 'n': 'Parlour', 'nav': '/mobile-dashboard/parlour',
               'cl': 'climate.parlour_trv', 'he': true,
               'holds': [
                 ['presence', 'binary_sensor.parlour_occupied_contained', 'on', 'Doors closed'],
                 ['presence', 'binary_sensor.parlour_sensor_sofa_occupancy', 'on', 'Sofa occupied'],
                 ['presence', 'media_player.parlour', 'playing', 'Sonos playing'],
                 ['heating', 'binary_sensor.parlour_external_openings', 'on', 'Door open']]},
              {'k': 'kitchen', 'n': 'Kitchen', 'nav': '/mobile-dashboard/kitchen',
               'cl': 'climate.kitchen_trv', 'he': true,
               'holds': [
                 ['presence', 'binary_sensor.kitchen_occupied_contained', 'on', 'Contained'],
                 ['heating', 'binary_sensor.kitchen_external_openings', 'on', 'Window open']]},
              {'k': 'hallway_downstairs', 'n': 'Hallway downstairs', 'nav': '/mobile-dashboard/hallway',
               'cl': 'climate.hallway_downstairs_trv', 'he': true,
               'holds': [
                 ['heating', 'binary_sensor.hallway_downstairs_external_openings', 'on', 'Door open']]},
              {'k': 'hallway_upstairs', 'n': 'Hallway upstairs', 'nav': '/mobile-dashboard/hallway',
               'cl': '', 'he': false, 'holds': []},
              {'k': 'bedroom', 'n': 'Bedroom', 'nav': '/mobile-dashboard/bedroom',
               'cl': 'climate.bedroom_trv', 'he': true,
               'holds': [
                 ['presence', 'binary_sensor.bedroom_sensor_bed_occupancy', 'on', 'Bed occupied'],
                 ['presence', 'binary_sensor.bedroom_occupied_contained', 'on', 'Doors closed'],
                 ['heating', 'binary_sensor.bedroom_external_openings', 'on', 'Window open']]},
              {'k': 'bathroom', 'n': 'Bathroom', 'nav': '/mobile-dashboard/bathroom',
               'cl': 'climate.bathroom_trv', 'he': true,
               'holds': [
                 ['presence', 'binary_sensor.bathroom_occupied_contained', 'on', 'Doors closed'],
                 ['heating', 'binary_sensor.bathroom_external_openings', 'on', 'Window open']]},
              {'k': 'home_office', 'n': 'Home office', 'nav': '/mobile-dashboard/home-office',
               'cl': 'climate.home_office_trv', 'he': true,
               'holds': [
                 ['presence', 'binary_sensor.home_office_occupied_contained', 'on', 'Doors closed'],
                 ['presence', 'media_player.home_office', 'playing', 'Sonos playing'],
                 ['presence', 'binary_sensor.home_office_monitor', 'on', 'Monitor on'],
                 ['heating', 'binary_sensor.home_office_external_openings', 'on', 'Window open']]},
              {'k': 'foreign_office', 'n': 'Foreign office', 'nav': '/mobile-dashboard/foreign-office',
               'cl': 'climate.foreign_office', 'he': true,
               'holds': [
                 ['presence', 'binary_sensor.foreign_office_occupied_contained', 'on', 'Doors closed'],
                 ['presence', 'binary_sensor.foreign_office_monitor', 'on', 'Monitor on'],
                 ['heating', 'binary_sensor.foreign_office_external_openings', 'on', 'Door open']]}
            ] %}
            {% set feed = state_attr('sensor.info_decision_feed', 'by_room') %}
            {% set feed = feed | from_json if feed is string else (feed or []) %}
            {% set mx = state_attr('sensor.info_manual_changes', 'changes') %}
            {% set manual_feed = mx | from_json if mx is string else (mx or []) %}
            {% set lx = state_attr('sensor.info_decision_feed', 'lights') %}
            {% set lights_feed = lx | from_json if lx is string else (lx or []) %}
            {% set out = namespace(items=[]) %}
            {% for c in cfg %}
              {% set k = c['k'] %}
              {% set occ = 'binary_sensor.' ~ k ~ '_occupied' %}
              {% set tsens = 'sensor.' ~ k ~ '_sensor_climate_temperature' %}
              {% set hs = namespace(items=[], presence=0, ext_open=false) %}
              {% for h in c['holds'] %}
                {% if states(h[1]) == h[2] %}
                  {% set hs.items = hs.items + [{'s': h[0], 'label': h[3], 'entity': h[1]}] %}
                  {% if h[0] == 'presence' %}{% set hs.presence = hs.presence + 1 %}{% endif %}
                  {% if h[0] == 'heating' %}{% set hs.ext_open = true %}{% endif %}
                {% endif %}
              {% endfor %}
              {% set override = is_state('input_boolean.' ~ k ~ '_automation_presence_override', 'on') %}
              {% set labels = hs.items | map(attribute='label') | list %}
              {# Override with no presence reason behind it must say so rather than look like a normal hold. #}
              {% set ovr = ('Override on (no active reason)' if hs.presence == 0 else 'Override on') if override else '' %}
              {% set reason_text = (labels + ([ovr] if ovr == 'Override on (no active reason)' else [])) | join(' · ') %}
              {% set un = namespace(items=[]) %}
              {% if c['cl'] and states(tsens) == 'unavailable' %}{% set un.items = un.items + ['temperature'] %}{% endif %}
              {% if states(occ) == 'unavailable' %}{% set un.items = un.items + ['occupancy'] %}{% endif %}
              {% set occupied = is_state(occ, 'on') %}
              {% set lights_on = is_state('group.' ~ k ~ '_lights', 'on') %}
              {% set active = states('sensor.' ~ k ~ '_active_heating') if c['he'] else '' %}
              {% set hvac = state_attr(c['cl'], 'hvac_action') if c['cl'] else none %}
              {# Room sensor is the temperature everywhere on the dashboard; the TRV's own reading sits next to a hot radiator or a cold window and disagrees. #}
              {% set temp = states(tsens) | float(none) if c['cl'] else none %}
              {% set temp = temp | round(1) if temp is not none else none %}
              {% set target = state_attr(c['cl'], 'temperature') if c['cl'] else none %}
              {% set mode_targets = {'comfort': 'comfort', 'baseline_day': 'baseline_day', 'baseline_night': 'baseline_night', 'minimum': 'minimum'} %}
              {% set mode_target = states('input_number.global_temperature_' ~ mode_targets[active]) | float(none) if active in mode_targets else none %}
              {% set hvac_mode = states(c['cl']) if c['cl'] else '' %}
              {# Why the TRV target differs from the mode's temperature, from data we can see. #}
              {% set differs = target is not none and mode_target is not none and (target | float(0) - mode_target) | abs > 0.5 %}
              {% if hvac_mode == 'off' %}{% set target_reason = 'TRV off' %}
              {% elif differs and hs.ext_open %}{% set target_reason = 'window open' %}
              {% elif differs and not is_state('input_boolean.house_heating_enabled', 'on') %}{% set target_reason = 'house heating off' %}
              {% elif differs %}{% set target_reason = 'differs from mode' %}
              {% else %}{% set target_reason = '' %}{% endif %}
              {% set scene = states('sensor.' ~ k ~ '_active_scene') %}
              {# Entries stored before the feed filtered plumbing may still be present; ignore them here too. #}
              {% set lasts = namespace(v=none) %}
              {% for f in feed if lasts.v is none and f.get('loc') == k and f.get('decision') not in ['update_external_temp', 'record'] and 'room_temp_feed' not in (f.get('auto') or '') %}
                {% set lasts.v = f %}
              {% endfor %}
              {% set last = lasts.v %}
              {% set parts = [('Occupancy unavailable' if 'occupancy' in un.items else ('Occupied' if occupied else 'Empty'))] %}
              {% set parts = parts + [('lights on' if lights_on else 'lights off')] %}
              {# Effective state: only said when the TRV target is not what the mode implies; otherwise the mode is noise. #}
              {% set mn = namespace(v=none) %}
              {% for m in manual_feed if mn.v is none and m.get('room') == k %}{% set mn.v = m %}{% endfor %}
              {# Light counts come from the room's light group members (kitchen ceiling is itself a group: counted once). #}
              {% set members = state_attr('group.' ~ k ~ '_lights', 'entity_id') or [] %}
              {% set lc = namespace(on=0) %}
              {% for m in members %}{% if is_state(m, 'on') %}{% set lc.on = lc.on + 1 %}{% endif %}{% endfor %}
              {% set lw = namespace(v=none) %}
              {% for f in lights_feed if lw.v is none and f.get('loc') == k %}{% set lw.v = f %}{% endfor %}
              {% if target_reason %}
                {% set parts = parts + ['heating target ' ~ (target | float(0)) ~ '° (' ~ target_reason ~ ')'] %}
              {% endif %}
              {% set pres_labels = hs.items | selectattr('s', 'eq', 'presence') | map(attribute='label') | list %}
              {% set heat_labels = hs.items | selectattr('s', 'eq', 'heating') | map(attribute='label') | list %}
              {% if pres_labels %}{% set parts = parts + ['held occupied by ' ~ (pres_labels | join(' · '))] %}{% endif %}
              {% if heat_labels and not target_reason %}{% set parts = parts + ['heating suspended: ' ~ (heat_labels | join(' · ') | lower)] %}{% endif %}
              {% if ovr %}{% set parts = parts + [ovr] %}{% endif %}
              {% set out.items = out.items + [{
                'k': k, 'n': c['n'], 'nav': c['nav'],
                'occupied': occupied,
                'occupancy_unavailable': 'occupancy' in un.items,
                'unavailable': un.items,
                'climate': c['cl'], 'temp_entity': tsens if c['cl'] else '',
                'temp': temp, 'target': target, 'mode_target': mode_target,
                'target_reason': target_reason, 'mode_name': active | replace('_', ' '),
                'pres_labels': pres_labels, 'heat_labels': heat_labels,
                'humidity': (states('sensor.' ~ k ~ '_sensor_climate_humidity') | float(none)) if c['cl'] else none,
                'hvac_action': hvac,
                'heating_active': active,
                'heating_source': states('sensor.' ~ k ~ '_heating_source') if c['he'] else '',
                'scene': scene | replace(k ~ '_', '', 1) | replace('_', ' ') if scene not in ['unknown', 'unavailable', ''] else '',
                'lights_enabled': not is_state('input_boolean.' ~ k ~ '_automation_lights_enabled', 'off'),
                'heating_enabled': (not is_state('input_boolean.' ~ k ~ '_automation_heating_enabled', 'off')) if c['he'] else none,
                'override': override,
                'ext_open': hs.ext_open,
                'holds': hs.items,
                'reason_text': reason_text,
                'override_text': ovr,
                'labels': labels,
                'manual': {'source': mn.v.get('source'), 'ts': mn.v.get('ts'), 'what': mn.v.get('what')} if mn.v and mn.v.get('source') else none,
                'lights_on': lc.on,
                'lights_total': members | length,
                'lights_why': (lw.v.get('why') or '') if lw.v else '',
                'lights_ts': (lw.v.get('ts') or '') if lw.v else '',
                'last': last.get('sentence') if last else '',
                'last_ts': last.get('ts') if last else '',
                'verdict': parts | join(' · ')
              }] %}
            {% endfor %}
            {{ out.items | tojson }}

      # Helper: computes the exception list once so `sensor.info_attention` can expose its
      # count as state and the list as an attribute without computing it twice or lagging.
      - name: Info Attention Calc
        unique_id: info_attention_calc
        icon: mdi:alert-circle-outline
        state: "ok"
        attributes:
          items: >-
            {% set rooms = state_attr('sensor.info_rooms', 'rooms') %}
            {% set rooms = rooms | from_json if rooms is string else (rooms or []) %}
            {# Durations (seconds): a state is flagged only once it has held this long, measured from the
               entity's own last_changed. The stale limit is in `info_stale_sensors`. #}
            {% set window_s = 5 * 60 %}
            {% set disabled_s = 12 * 3600 %}
            {% set hold_presence_s = 6 * 3600 %}
            {% set hold_bare_s = 30 * 60 %}
            {% set unavailable_s = 15 * 60 %}
            {# Seconds since the entity last changed; -1 for a missing entity so it never passes a threshold. #}
            {% macro age(e) %}{{ (now() - states[e].last_changed).total_seconds() if states[e] is not none else -1 }}{% endmacro %}
            {% macro dur(sec) %}{{ (sec // 3600) | int }} h {{ ((sec % 3600) // 60) | int }} min{% endmacro %}
            {% set heating_master = is_state('input_boolean.house_heating_enabled', 'on') %}
            {% set sl = state_attr('sensor.info_stale_sensors', 'stale') %}
            {% set stale = sl | from_json if sl is string else (sl or []) %}
            {% set out = namespace(items=[]) %}
            {% for r in rooms %}
              {% set k = r['k'] %}
              {# The openings sensor must itself have been on past the threshold, not just the room held. #}
              {% set open_long = namespace(v=false) %}
              {% for h in r['holds'] if h['s'] == 'heating' and (age(h['entity']) | trim | float(-1)) > window_s %}
                {% set open_long.v = true %}
              {% endfor %}
              {% if open_long.v and r['hvac_action'] == 'heating' and heating_master %}
                {% set out.items = out.items + [{'room': r['n'], 'key': k, 'kind': 'window_open_heating_on',
                  'text': 'Open window or door while heating is on', 'nav': r['nav']}] %}
              {% endif %}
              {% set off = [] %}
              {% if not r['lights_enabled'] and (age('input_boolean.' ~ k ~ '_automation_lights_enabled') | trim | float(-1)) > disabled_s %}{% set off = off + ['lights'] %}{% endif %}
              {% if r['heating_enabled'] == false and (age('input_boolean.' ~ k ~ '_automation_heating_enabled') | trim | float(-1)) > disabled_s %}{% set off = off + ['heating'] %}{% endif %}
              {% if off %}
                {% set out.items = out.items + [{'room': r['n'], 'key': k, 'kind': 'automation_disabled',
                  'text': (off | join(' and ') | capitalize) ~ ' automation off', 'nav': r['nav']}] %}
              {% endif %}
              {# A presence reason makes an override expected for longer; with none it is probably forgotten. #}
              {% set hold_s = hold_presence_s if r['pres_labels'] else hold_bare_s %}
              {% if r['override'] and (age('input_boolean.' ~ k ~ '_automation_presence_override') | trim | float(-1)) > hold_s %}
                {% set out.items = out.items + [{'room': r['n'], 'key': k, 'kind': 'hold_active',
                  'text': r['override_text'] ~ (' · held by ' ~ (r['labels'] | join(' · ')) if r['labels'] else ''),
                  'nav': r['nav']}] %}
              {% endif %}
              {# Only room entities are checked (never binary_sensor.test_location_occupied). #}
              {% set un_entities = {'temperature': r['temp_entity'], 'occupancy': 'binary_sensor.' ~ k ~ '_occupied'} %}
              {% set un = namespace(items=[]) %}
              {% for w in r['unavailable'] if un_entities.get(w) and (age(un_entities[w]) | trim | float(-1)) > unavailable_s %}
                {% set un.items = un.items + [w] %}
              {% endfor %}
              {% if un.items %}
                {% set out.items = out.items + [{'room': r['n'], 'key': k, 'kind': 'sensor_unavailable',
                  'text': (un.items | join(' and ') | capitalize) ~ ' sensor unavailable', 'nav': r['nav']}] %}
              {% endif %}
              {% for s in stale if s['k'] == k %}
                {% set out.items = out.items + [{'room': r['n'], 'key': k, 'kind': 'sensor_stale',
                  'text': s['entity'] ~ ': no update for ' ~ (dur(s['age_s'] | float(0)) | trim), 'nav': r['nav']}] %}
              {% endfor %}
            {% endfor %}
            {% for g in [['back_garden', 'Back garden', '/mobile-dashboard/back-garden'], ['front_garden', 'Front garden', '/mobile-dashboard/front-garden']] %}
              {% set gh = 'input_boolean.' ~ g[0] ~ '_automation_lights_enabled' %}
              {% if is_state(gh, 'off') and (age(gh) | trim | float(-1)) > disabled_s %}
                {% set out.items = out.items + [{'room': g[1], 'key': g[0], 'kind': 'automation_disabled',
                  'text': 'Lights automation off', 'nav': g[2]}] %}
              {% endif %}
            {% endfor %}
            {# Temperature kinds come from the debounced binary sensors (see Info Temperature Rule); the room
               sensor (rooms[].temp), not the TRV reading, is the temperature. A non-numeric temp or target gives
               no item rather than a guessed one. #}
            {% for r in rooms if r['temp'] is number and r['target'] is number %}
              {% if is_state('binary_sensor.info_' ~ r['k'] ~ '_cold_not_heating', 'on') %}
                {% set out.items = out.items + [{'room': r['n'], 'key': r['k'], 'kind': 'cold_not_heating',
                  'text': r['temp'] ~ '° vs ' ~ r['target'] ~ '° target, heating not on', 'nav': r['nav']}] %}
              {% endif %}
              {% if is_state('binary_sensor.info_' ~ r['k'] ~ '_warm_heating', 'on') %}
                {% set out.items = out.items + [{'room': r['n'], 'key': r['k'], 'kind': 'warm_heating',
                  'text': r['temp'] ~ '° vs ' ~ r['target'] ~ '° target, heating on', 'nav': r['nav']}] %}
              {% endif %}
            {% endfor %}
            {{ out.items | tojson }}

      - name: Info Attention
        unique_id: info_attention
        icon: mdi:alert-circle-outline
        state: >-
          {% set x = state_attr('sensor.info_attention_calc', 'items') %}
          {{ (x | from_json if x is string else (x or [])) | length }}
        attributes:
          items: >-
            {% set x = state_attr('sensor.info_attention_calc', 'items') %}
            {{ (x | from_json if x is string else (x or [])) | tojson }}

      # Room temperature sensors and climate entities with no state update for over the stale limit.
      # The limit is defined only here; `info_temperature_rule` and `info_attention_calc` read the list.
      # `last_updated` is the clock (room sensors change at least every 1.5 h). An unavailable entity is
      # its own attention kind (`sensor_unavailable`) and a missing entity is skipped, so neither is
      # reported as stale. Rooms without a climate entity have no entities listed and are never checked.
      - name: Info Stale Sensors
        unique_id: info_stale_sensors
        icon: mdi:clock-alert-outline
        state: "ok"
        attributes:
          stale: >-
            {% set stale_s = 4 * 3600 %}
            {% set rooms = state_attr('sensor.info_rooms', 'rooms') %}
            {% set rooms = rooms | from_json if rooms is string else (rooms or []) %}
            {% set out = namespace(items=[]) %}
            {% for r in rooms if r['climate'] %}
              {% for e in [r['temp_entity'], r['climate']] %}
                {% set st = states[e] %}
                {% if st is not none and st.state != 'unavailable' %}
                  {% set age = (now() - st.last_updated).total_seconds() %}
                  {% if age > stale_s %}
                    {% set out.items = out.items + [{'k': r['k'], 'entity': e, 'age_s': age | int}] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {{ out.items | tojson }}

      # Temperature rule behind the `cold_not_heating` / `warm_heating` attention kinds.
      # `rooms` lists, undebounced, the rooms meeting each condition right now; the binary sensors
      # below add the debounce. The delta is defined only here; the stale limit is in `info_stale_sensors`.
      # Foreign office is included on purpose (the old outlier check skipped it with no recorded
      # reason). A missing or non-numeric reading, or a TRV or room sensor listed by
      # `info_stale_sensors`, puts a room in neither list: a dead sensor must never raise a flag.
      - name: Info Temperature Rule
        unique_id: info_temperature_rule
        icon: mdi:thermometer-alert
        state: "ok"
        attributes:
          flagged: >-
            {% set delta = 1.5 %}
            {% set st = state_attr('sensor.info_stale_sensors', 'stale') %}
            {% set stale_rooms = (st | from_json if st is string else (st or [])) | map(attribute='k') | list %}
            {% set rooms = state_attr('sensor.info_rooms', 'rooms') %}
            {% set rooms = rooms | from_json if rooms is string else (rooms or []) %}
            {% set master = is_state('input_boolean.house_heating_enabled', 'on') %}
            {% set out = namespace(cold=[], warm=[]) %}
            {% for r in rooms if r['temp'] is number and r['target'] is number and r['hvac_action'] in ['idle', 'heating'] %}
              {% set k = r['k'] %}
              {% set cl = r['climate'] %}
              {% if k not in stale_rooms %}
                {# Cold: an idle TRV is the fault; exclusions are the reasons a cold room is expected. Mode minimum or off
                   means no heating was asked for; an unavailable/unknown mode is unproven, so it never raises a flag. #}
                {% set cold_explained = r['heat_labels'] or r['heating_enabled'] == false or not master
                   or r['heating_active'] in ['minimum', 'off', 'unavailable', 'unknown'] or is_state(cl, 'off') %}
                {% if r['temp'] < r['target'] - delta and r['hvac_action'] != 'heating' and not cold_explained %}
                  {% set out.cold = out.cold + [k] %}
                {% endif %}
                {# Warm: a window/door hold already explains heating and is its own attention item. #}
                {% if r['temp'] > r['target'] + delta and r['hvac_action'] == 'heating' and not r['ext_open'] %}
                  {% set out.warm = out.warm + [k] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ {'cold': out.cold, 'warm': out.warm} | tojson }}

  # Debounced temperature flags, one pair per room with a climate entity. Cold is held longer than
  # warm: a room warming up after a schedule change lags the target, an overheating room does not.
  # The durations are YAML anchors so each is written once.
  - binary_sensor:
      - name: Info Parlour Cold Not Heating
        unique_id: info_parlour_cold_not_heating
        state: >-
          {% set x = state_attr('sensor.info_temperature_rule', 'flagged') %}
          {% set x = x | from_json if x is string else (x or {}) %}
          {{ 'parlour' in x.get('cold', []) }}
        delay_on: &cold_debounce
          minutes: 60
      - name: Info Kitchen Cold Not Heating
        unique_id: info_kitchen_cold_not_heating
        state: >-
          {% set x = state_attr('sensor.info_temperature_rule', 'flagged') %}
          {% set x = x | from_json if x is string else (x or {}) %}
          {{ 'kitchen' in x.get('cold', []) }}
        delay_on: *cold_debounce
      - name: Info Hallway Downstairs Cold Not Heating
        unique_id: info_hallway_downstairs_cold_not_heating
        state: >-
          {% set x = state_attr('sensor.info_temperature_rule', 'flagged') %}
          {% set x = x | from_json if x is string else (x or {}) %}
          {{ 'hallway_downstairs' in x.get('cold', []) }}
        delay_on: *cold_debounce
      - name: Info Bedroom Cold Not Heating
        unique_id: info_bedroom_cold_not_heating
        state: >-
          {% set x = state_attr('sensor.info_temperature_rule', 'flagged') %}
          {% set x = x | from_json if x is string else (x or {}) %}
          {{ 'bedroom' in x.get('cold', []) }}
        delay_on: *cold_debounce
      - name: Info Bathroom Cold Not Heating
        unique_id: info_bathroom_cold_not_heating
        state: >-
          {% set x = state_attr('sensor.info_temperature_rule', 'flagged') %}
          {% set x = x | from_json if x is string else (x or {}) %}
          {{ 'bathroom' in x.get('cold', []) }}
        delay_on: *cold_debounce
      - name: Info Home Office Cold Not Heating
        unique_id: info_home_office_cold_not_heating
        state: >-
          {% set x = state_attr('sensor.info_temperature_rule', 'flagged') %}
          {% set x = x | from_json if x is string else (x or {}) %}
          {{ 'home_office' in x.get('cold', []) }}
        delay_on: *cold_debounce
      - name: Info Foreign Office Cold Not Heating
        unique_id: info_foreign_office_cold_not_heating
        state: >-
          {% set x = state_attr('sensor.info_temperature_rule', 'flagged') %}
          {% set x = x | from_json if x is string else (x or {}) %}
          {{ 'foreign_office' in x.get('cold', []) }}
        delay_on: *cold_debounce
  - binary_sensor:
      - name: Info Parlour Warm Heating
        unique_id: info_parlour_warm_heating
        state: >-
          {% set x = state_attr('sensor.info_temperature_rule', 'flagged') %}
          {% set x = x | from_json if x is string else (x or {}) %}
          {{ 'parlour' in x.get('warm', []) }}
        delay_on: &warm_debounce
          minutes: 30
      - name: Info Kitchen Warm Heating
