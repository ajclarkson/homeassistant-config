# Recorder settings live here, in git, so exclusions ship as a normal PR.
# A non-list key may be defined only once across configuration.yaml and all packages, so the PVC
# configuration.yaml must not also set recorder.exclude. Recorder config is read at startup:
# changes here need an HA restart, not a reload.
recorder:
  exclude:
    entity_globs:
      # homerun history and catalogue: live JSON for Pulse, rewritten on every homerun event.
      # Pulse reads live state, so recording them only adds churn, and the house history can
      # exceed the recorder's 16 KB attribute limit.
      - sensor.*_history
    entities:
      - sensor.homerun_catalog
      # Pulse-internal derived sensors. Pulse and the other template sensors read their live state
      # through state_attr only; nothing reads their history (no history, statistics, logbook or
      # apexcharts use anywhere in this repo). Listed one by one, not as sensor.info_*, because
      # sensor.info_attention, sensor.info_temperature_rule and the info_*_heating binary sensors stay
      # recorded: their small histories show when an alert appeared and why.
      - sensor.info_rooms
      - sensor.info_attention_calc
      - sensor.info_manual_changes
      - sensor.info_stale_sensors
