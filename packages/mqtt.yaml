mqtt:
  sensor:
    - name: "House Active Mode"
      unique_id: house_active_mode
      state_topic: "house/mode/active"

    # Active Heating Topics
    - name: "Parlour Active Heating"
      unique_id: parlour_active_heating
      state_topic: "parlour/heating/active"
    - name: "Hallway Downstairs Active Heating"
      unique_id: hallway_downstairs_active_heating
      state_topic: "hallway_downstairs/heating/active"
    - name: "Kitchen Active Heating"
      unique_id: kitchen_active_heating
      state_topic: "kitchen/heating/active"
    - name: "Bedroom Active Heating"
      unique_id: bedroom_active_heating
      state_topic: "bedroom/heating/active"
    - name: "Bathroom Active Heating"
      unique_id: bathroom_active_heating
      state_topic: "bathroom/heating/active"
    - name: "Home Office Active Heating"
      unique_id: home_office_active_heating
      state_topic: "home_office/heating/active"
    - name: "Foreign Office Active Heating"
      unique_id: foreign_office_active_heating
      state_topic: "foreign_office/heating/active"

    # Heating Source Topics (why the active mode was chosen)
    - name: "Parlour Heating Source"
      unique_id: parlour_heating_source
      state_topic: "parlour/heating/source"
    - name: "Hallway Downstairs Heating Source"
      unique_id: hallway_downstairs_heating_source
      state_topic: "hallway_downstairs/heating/source"
    - name: "Kitchen Heating Source"
      unique_id: kitchen_heating_source
      state_topic: "kitchen/heating/source"
    - name: "Bedroom Heating Source"
      unique_id: bedroom_heating_source
      state_topic: "bedroom/heating/source"
    - name: "Bathroom Heating Source"
      unique_id: bathroom_heating_source
      state_topic: "bathroom/heating/source"
    - name: "Home Office Heating Source"
      unique_id: home_office_heating_source
      state_topic: "home_office/heating/source"
    - name: "Foreign Office Heating Source"
      unique_id: foreign_office_heating_source
      state_topic: "foreign_office/heating/source"

    # Lighting Decision Helpers (per room)
    - name: "Parlour Lighting Decision"
      unique_id: parlour_lighting_decision
      state_topic: "parlour/lighting/decision"
      value_template: "{{ value_json.decision }}"
      json_attributes_topic: "parlour/lighting/decision"

    - name: "Kitchen Lighting Decision"
      unique_id: kitchen_lighting_decision
      state_topic: "kitchen/lighting/decision"
      value_template: "{{ value_json.decision }}"
      json_attributes_topic: "kitchen/lighting/decision"

    - name: "Hallway Downstairs Lighting Decision"
      unique_id: hallway_downstairs_lighting_decision
      state_topic: "hallway_downstairs/lighting/decision"
      value_template: "{{ value_json.decision }}"
      json_attributes_topic: "hallway_downstairs/lighting/decision"

    - name: "Hallway Upstairs Lighting Decision"
      unique_id: hallway_upstairs_lighting_decision
      state_topic: "hallway_upstairs/lighting/decision"
      value_template: "{{ value_json.decision }}"
      json_attributes_topic: "hallway_upstairs/lighting/decision"

    - name: "Bedroom Lighting Decision"
      unique_id: bedroom_lighting_decision
      state_topic: "bedroom/lighting/decision"
      value_template: "{{ value_json.decision }}"
      json_attributes_topic: "bedroom/lighting/decision"

    - name: "Bathroom Lighting Decision"
      unique_id: bathroom_lighting_decision
      state_topic: "bathroom/lighting/decision"
      value_template: "{{ value_json.decision }}"
      json_attributes_topic: "bathroom/lighting/decision"

    # New decision sensors use homerun's live topic homerun/{location}/{subsystem}/decision
    # (retained). The older per-room decision sensors above subscribe to the legacy
    # {location}/{subsystem}/decision topic, which no longer receives data.
    - name: "Bathroom Shower Decision"
      unique_id: bathroom_shower_decision
      state_topic: "homerun/bathroom/shower/decision"
      value_template: "{{ value_json.decision }}"
      json_attributes_topic: "homerun/bathroom/shower/decision"

    - name: "Bathroom Fan Decision"
      unique_id: bathroom_fan_decision
      state_topic: "homerun/bathroom/fan/decision"
      value_template: "{{ value_json.decision }}"
      json_attributes_topic: "homerun/bathroom/fan/decision"

    - name: "Home Office Lighting Decision"
      unique_id: home_office_lighting_decision
      state_topic: "home_office/lighting/decision"
      value_template: "{{ value_json.decision }}"
      json_attributes_topic: "home_office/lighting/decision"

    - name: "Foreign Office Lighting Decision"
      unique_id: foreign_office_lighting_decision
      state_topic: "foreign_office/lighting/decision"
      value_template: "{{ value_json.decision }}"
      json_attributes_topic: "foreign_office/lighting/decision"

    # Hildebrand Glow — smart meter live data
    - name: "Glow Electricity Power"
      unique_id: glow_electricity_power
      state_topic: "glow/F008D1ECE254/SENSOR/electricitymeter"
      value_template: "{{ value_json.electricitymeter.power.value }}"
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement

    - name: "Glow Electricity Today"
      unique_id: glow_electricity_today
      state_topic: "glow/F008D1ECE254/SENSOR/electricitymeter"
      value_template: "{{ value_json.electricitymeter.energy.import.day }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    - name: "Glow Electricity Month"
      unique_id: glow_electricity_month
      state_topic: "glow/F008D1ECE254/SENSOR/electricitymeter"
      value_template: "{{ value_json.electricitymeter.energy.import.month }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    - name: "Glow Gas Today"
      unique_id: glow_gas_today
      state_topic: "glow/F008D1ECE254/SENSOR/gasmeter"
      value_template: "{{ value_json.gasmeter.energy.import.day }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    - name: "Glow Gas Month"
      unique_id: glow_gas_month
      state_topic: "glow/F008D1ECE254/SENSOR/gasmeter"
      value_template: "{{ value_json.gasmeter.energy.import.month }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    # Garden lighting (published retained by homerun, so they survive an HA restart)
    # The off time ("00:00") is the state; preview_min is null when the garden has no preview limit.
    - name: "Front Garden Lighting Window"
      unique_id: front_garden_lighting_window
      state_topic: "front_garden/lighting/window"
      value_template: "{{ value_json.off }}"
      json_attributes_topic: "front_garden/lighting/window"
    - name: "Back Garden Lighting Window"
      unique_id: back_garden_lighting_window
      state_topic: "back_garden/lighting/window"
      value_template: "{{ value_json.off }}"
      json_attributes_topic: "back_garden/lighting/window"
    # Today's calendar theme is the state; attributes are next ({date, theme} or null) and unknown_themes.
    - name: "Front Garden Light Theme Calendar"
      unique_id: front_garden_light_theme_calendar
      state_topic: "front_garden/lighting/theme_calendar"
      value_template: "{{ value_json.today }}"
      json_attributes_topic: "front_garden/lighting/theme_calendar"

    # homerun history and catalogue (home.history.v1, home.catalog.v1; contract: homeOS docs/contracts/events.md).
    # Published retained, so they survive an HA restart. The state is the newest entry's timestamp; "None"
    # (an empty history) makes the sensor unknown rather than stale.
    # These are large attributes (up to 20 entries a location, 30 house-wide): exclude every one from the
    # recorder (see the PR for the recorder step). Entries are structured only; the Pulse card words them.
    - name: "Parlour History"
      unique_id: parlour_history
      state_topic: "homerun/parlour/history"
      value_template: "{{ value_json.entries[0].ts if value_json.entries else none }}"
      json_attributes_topic: "homerun/parlour/history"
    - name: "Kitchen History"
      unique_id: kitchen_history
      state_topic: "homerun/kitchen/history"
      value_template: "{{ value_json.entries[0].ts if value_json.entries else none }}"
      json_attributes_topic: "homerun/kitchen/history"
    - name: "Hallway Downstairs History"
      unique_id: hallway_downstairs_history
      state_topic: "homerun/hallway_downstairs/history"
      value_template: "{{ value_json.entries[0].ts if value_json.entries else none }}"
      json_attributes_topic: "homerun/hallway_downstairs/history"
    - name: "Hallway Upstairs History"
      unique_id: hallway_upstairs_history
      state_topic: "homerun/hallway_upstairs/history"
      value_template: "{{ value_json.entries[0].ts if value_json.entries else none }}"
      json_attributes_topic: "homerun/hallway_upstairs/history"
    - name: "Bedroom History"
      unique_id: bedroom_history
      state_topic: "homerun/bedroom/history"
      value_template: "{{ value_json.entries[0].ts if value_json.entries else none }}"
      json_attributes_topic: "homerun/bedroom/history"
    - name: "Bathroom History"
      unique_id: bathroom_history
      state_topic: "homerun/bathroom/history"
      value_template: "{{ value_json.entries[0].ts if value_json.entries else none }}"
      json_attributes_topic: "homerun/bathroom/history"
    - name: "Home Office History"
      unique_id: home_office_history
      state_topic: "homerun/home_office/history"
      value_template: "{{ value_json.entries[0].ts if value_json.entries else none }}"
      json_attributes_topic: "homerun/home_office/history"
    - name: "Foreign Office History"
      unique_id: foreign_office_history
      state_topic: "homerun/foreign_office/history"
      value_template: "{{ value_json.entries[0].ts if value_json.entries else none }}"
      json_attributes_topic: "homerun/foreign_office/history"
    - name: "Front Garden History"
      unique_id: front_garden_history
      state_topic: "homerun/front_garden/history"
      value_template: "{{ value_json.entries[0].ts if value_json.entries else none }}"
      json_attributes_topic: "homerun/front_garden/history"
    - name: "Back Garden History"
      unique_id: back_garden_history
      state_topic: "homerun/back_garden/history"
      value_template: "{{ value_json.entries[0].ts if value_json.entries else none }}"
      json_attributes_topic: "homerun/back_garden/history"
    - name: "House History"
      unique_id: house_history
      state_topic: "homerun/history"
      value_template: "{{ value_json.entries[0].ts if value_json.entries else none }}"
      json_attributes_topic: "homerun/history"
    # The catalogue is ~22 KB raw, over the recorder's 16 KB attribute cap, so only a projection is kept:
    # the "subsystem:reason" keys a person would want explained (outcome acted or declined). The card
    # compares them with its wording table and raises "unexplained_reason" for any it cannot word.
    - name: "Homerun Catalog"
      unique_id: homerun_catalog
      state_topic: "homerun/catalog"
      value_template: "{{ (value_json.automations | default([])) | length }}"
      json_attributes_topic: "homerun/catalog"
      json_attributes_template: >-
        {% set ns = namespace(found=[]) %}
        {% for a in (value_json.automations | default([])) %}
          {% for r, v in a['reasons'].items() if v['outcome'] in ['acted', 'declined'] %}
            {% set ns.found = ns.found + [a['subsystem'] ~ ':' ~ r] %}
          {% endfor %}
        {% endfor %}
        {{ {'schema': value_json.schema, 'reasons': ns.found | unique | sort | list} | tojson }}

  binary_sensor:
    # Occupancy Topics
    - name: "Parlour Occupied"
      unique_id: parlour_occupied
      state_topic: "parlour/occupied/state"
    - name: "Hallway Downstairs Occupied"
      unique_id: hallway_downstairs_occupied
      state_topic: "hallway_downstairs/occupied/state"
    - name: "Hallway Upstairs Occupied"
      unique_id: hallway_upstairs_occupied
      state_topic: "hallway_upstairs/occupied/state"
    - name: "Kitchen Occupied"
      unique_id: kitchen_occupied
      state_topic: "kitchen/occupied/state"
    - name: "Bedroom Occupied"
      unique_id: bedroom_occupied
      state_topic: "bedroom/occupied/state"
    - name: "Bathroom Occupied"
      unique_id: bathroom_occupied
      state_topic: "bathroom/occupied/state"
    - name: "Bathroom Shower"
      unique_id: bathroom_shower
      state_topic: "bathroom/shower/state"
    # ON while the fan controller owns the fan run; it only turns off a fan it turned on.
    - name: "Bathroom Fan Auto"
      unique_id: bathroom_fan_auto
      state_topic: "bathroom/fan/auto"
    - name: "Home Office Occupied"
      unique_id: home_office_occupied
      state_topic: "home_office/occupied/state"
    - name: "Foreign Office Occupied"
      unique_id: foreign_office_occupied
      state_topic: "foreign_office/occupied/state"

    # Room contained trackers
    - name: "Parlour Occupied Contained"
      unique_id: "parlour_occupied_contained"
      state_topic: "parlour/occupied/contained/state"
    - name: "Hallway Downstairs Occupied Contained"
      unique_id: "hallway_downstairs_occupied_contained"
      state_topic: "hallway_downstairs/occupied/contained/state"
    - name: "Hallway Upstairs Occupied Contained"
      unique_id: "hallway_upstairs_occupied_contained"
      state_topic: "hallway_upstairs/occupied/contained/state"
    - name: "Kitchen Occupied Contained"
      unique_id: "kitchen_occupied_contained"
      state_topic: "kitchen/occupied/contained/state"
    - name: "Bedroom Occupied Contained"
      unique_id: "bedroom_occupied_contained"
      state_topic: "bedroom/occupied/contained/state"
    - name: "Bathroom Occupied Contained"
      unique_id: "bathroom_occupied_contained"
      state_topic: "bathroom/occupied/contained/state"
    - name: "Home Office Occupied Contained"
      unique_id: "home_office_occupied_contained"
      state_topic: "home_office/occupied/contained/state"
    - name: "Foreign Office Occupied Contained"
      unique_id: "foreign_office_occupied_contained"
      state_topic: "foreign_office/occupied/contained/state"

    # Recent Auto Off Light Trackers
    - name: "Parlour Lighting Recent Auto Off"
      unique_id: "parlour_lighting_recent_auto_off"
      state_topic: "parlour/lighting/recent_auto_off"
    - name: "Hallway Downstairs Lighting Recent Auto Off"
      unique_id: "hallway_downstairs_recent_auto_off"
      state_topic: "hallway_downstairs/lighting/recent_auto_off"
    - name: "Hallway Upstairs Lighting Recent Auto Off"
      unique_id: "hallway_upstairs_lighting_recent_auto_off"
      state_topic: "hallway_upstairs/lighting/recent_auto_off"
    - name: "Kitchen Lighting Recent Auto Off"
      unique_id: "kitchen_lighting_recent_auto_off"
      state_topic: "kitchen/lighting/recent_auto_off"
    - name: "Bedroom Lighting Recent Auto Off"
      unique_id: "bedroom_lighting_recent_auto_off"
      state_topic: "bedroom/lighting/recent_auto_off"
    - name: "Bathroom Lighting Recent Auto Off"
      unique_id: "bathroom_lighting_recent_auto_off"
      state_topic: "bathroom/lighting/recent_auto_off"
    - name: "Home Office Lighting Recent Auto Off"
      unique_id: "home_office_lighting_recent_auto_off"
