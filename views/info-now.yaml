# Pulse "Now": header, attention, room rows, energy, bins, heating, feed.
# All text sections are `custom:pulse-card` (www/pulse-card.js, loaded via packages/frontend.yaml).
# Only the price bars use another card (apexcharts-card), fed by PulseLib.rateSeries so the logic
# is tested offline and never assumes 48 half-hour slots.
title: Now
path: now
icon: mdi:home-heart
type: sections
max_columns: 1
background: '#12151a'
sections:
  - type: grid
    cards:
      - {type: custom:pulse-card, mode: now-header}
      - {type: custom:pulse-card, mode: attention}
      - {type: custom:pulse-card, mode: rooms}
      - type: vertical-stack
        card_mod:
          style: |
            ha-card { --vertical-stack-card-gap: 0px; background: transparent; box-shadow: none; border: none; }
        cards:
          - {type: custom:pulse-card, mode: energy}
          - type: custom:apexcharts-card
            header: {show: false}
            graph_span: 24h
            span: {start: day}
            now: {show: true, label: ''}
            apex_config:
              chart:
                height: 90
                stacked: true
                toolbar: {show: false}
                zoom: {enabled: false}
                background: '#1a1f26'
              plotOptions: {bar: {columnWidth: '90%', borderRadius: 1}}
              dataLabels: {enabled: false}
              stroke: {show: false}
              legend: {show: false}
              grid:
                show: false
                padding: {left: 8, right: 8, top: 0, bottom: 0}
              xaxis:
                type: datetime
                tickAmount: 4
                axisBorder: {show: false}
                axisTicks: {show: false}
                labels:
                  datetimeUTC: false
                  format: HH
                  style: {colors: '#8f9aa8', fontSize: 10px}
              yaxis: {show: false}
              tooltip: {enabled: false}
            card_mod:
              style: |
                ha-card { border: none; border-radius: 0; box-shadow: none; background: #1a1f26; padding: 0 6px; }
            series:
              # Past slots dimmed, current slot bright, future slots green (cheap) / amber (peak) / blue.
              - &price_series
                entity: sensor.octopus_energy_electricity_24e8140196_1012483035417_current_rate
                name: Past
                type: column
                color: '#3b4a5c'
                show: {legend_value: false}
                data_generator: |
                  return window.PulseLib ? window.PulseLib.rateSeries(hass.states['event.octopus_energy_electricity_24e8140196_1012483035417_current_day_rates']?.attributes?.rates, 'past', Date.now()) : [];
              - <<: *price_series
                name: Now
                color: '#e8ebef'
                data_generator: |
                  return window.PulseLib ? window.PulseLib.rateSeries(hass.states['event.octopus_energy_electricity_24e8140196_1012483035417_current_day_rates']?.attributes?.rates, 'current', Date.now()) : [];
              - <<: *price_series
                name: Cheap
                color: '#6fcf97'
                data_generator: |
                  return window.PulseLib ? window.PulseLib.rateSeries(hass.states['event.octopus_energy_electricity_24e8140196_1012483035417_current_day_rates']?.attributes?.rates, 'cheap', Date.now()) : [];
              - <<: *price_series
                name: Mid
                color: '#5d7390'
                data_generator: |
                  return window.PulseLib ? window.PulseLib.rateSeries(hass.states['event.octopus_energy_electricity_24e8140196_1012483035417_current_day_rates']?.attributes?.rates, 'mid', Date.now()) : [];
              - <<: *price_series
                name: Peak
                color: '#f2b84b'
                data_generator: |
                  return window.PulseLib ? window.PulseLib.rateSeries(hass.states['event.octopus_energy_electricity_24e8140196_1012483035417_current_day_rates']?.attributes?.rates, 'peak', Date.now()) : [];
          - {type: custom:pulse-card, mode: energy-foot}
      - {type: custom:pulse-card, mode: bins}
      - {type: custom:pulse-card, mode: heating}
      - {type: custom:pulse-card, mode: feed}
      - {type: custom:pulse-card, mode: footer}
