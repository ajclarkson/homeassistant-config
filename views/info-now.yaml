# Pulse "Now" (v2): quiet by default, loud by exception. Header, one status card (verdict, people, prices),
# room groups (needs attention / occupied now / other rooms), prices, bins + heating, feed.
# Every section is `custom:pulse-card` (www/pulse-card.js, loaded via packages/frontend.yaml).
# The price bars are drawn by pulse-card itself from the rates attribute (any slot count).
title: Now
path: now
icon: mdi:home-heart
type: sections
max_columns: 1
background: '#12151a'
sections:
  - type: grid
    cards:
      - {type: custom:pulse-card, mode: now-header}
      # One status card: verdict, sentence, people/Mo chips and the Now/Next/Usage price strip.
      - {type: custom:pulse-card, mode: status}
      # Needs attention (full width), Occupied now (full width), Other rooms (2-column tiles).
      - {type: custom:pulse-card, mode: rooms}
      # Today's prices: bars with scrub, Cheapest 2h, tomorrow note. Add `details_path:
      # /pulse-dashboard/energy` here only once that view exists in info-dashboard.yaml.
      - {type: custom:pulse-card, mode: energy}
      - {type: custom:pulse-card, mode: bins-heating}
      - {type: custom:pulse-card, mode: feed}
      - {type: custom:pulse-card, mode: footer}
