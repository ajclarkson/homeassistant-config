# Pulse "Now": header, attention, room rows, energy, bins, heating, feed.
# Every section is `custom:pulse-card` (www/pulse-card.js, loaded via packages/frontend.yaml).
# The price bars are drawn by pulse-card itself from the rates attribute (any slot count).
title: Now
path: now
icon: mdi:home-heart
type: sections
max_columns: 1
background: '#12151a'
sections:
  - type: grid
    cards:
      - {type: custom:pulse-card, mode: now-header}
      - {type: custom:pulse-card, mode: attention}
      - {type: custom:pulse-card, mode: rooms}
      # One card: numbers, price bars (drawn by pulse-card from the rates attribute), cheapest-2h, tomorrow note.
      - {type: custom:pulse-card, mode: energy}
      - {type: custom:pulse-card, mode: bins}
      - {type: custom:pulse-card, mode: heating}
      - {type: custom:pulse-card, mode: feed}
      - {type: custom:pulse-card, mode: footer}
