title: Front Garden
path: front-garden
type: sections
max_columns: 1
sections:
  - type: grid
    cards:
      - type: custom:streamline-card
        template: section_title
        variables:
          title: Front Garden
      # Scenes and themes live in Pulse, the one place that explains why the garden is as it is.
      - type: custom:button-card
        name: Lights and themes
        icon: m3of:lightbulb
        tap_action:
          action: navigate
          navigation_path: /pulse-dashboard/room-front_garden
      - type: custom:streamline-card
        template: lighting_automation_section_sleep_hold
        variables:
          toggle_entity: input_boolean.front_garden_automation_lights_enabled
  - type: grid
    cards:
      - type: custom:streamline-card
        template: rooms_popup
      - type: custom:streamline-card
        template: page_footer
        variables:
          active: rooms

