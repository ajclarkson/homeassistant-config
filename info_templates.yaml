# Shared room page for the Pulse dashboard. One template, parameterised by room; every room view
# (views/info-room-*.yaml) is a single call to it. Sections that do not apply to a room (media,
# individual lights, chart) hide themselves, so there is no per-room card list to copy.
#
# Variables (for rooms without climate pass the conventional ids anyway; the chart hides itself):
#   room     key used by custom:pulse-card (see ROOMS in www/pulse-card.js) and by helper ids
#   climate  climate entity for the 24h chart target line
#   temp     room temperature sensor for the 24h chart
#   fan, fan_decision, fan_label  optional fan row under the scenes: its switch, the decision sensor
#            whose reason explains it, and its title. Leave blank and the row hides itself.
# streamline-card takes defaults only from `default` (a list of single-key maps); a template-level
# `variables:` map is ignored, which left `[[fan]]` as literal text in rooms without a fan.
pulse_room:
  default:
    - room: ''
    - climate: ''
    - temp: ''
    - fan: ''
    - fan_decision: ''
    - fan_label: ''
  card:
    type: vertical-stack
    cards:
      - type: custom:pulse-card
        mode: room-head
        room: '[[room]]'
      # Lighting (scenes, with the individual lights expanding inside it) is the control used most, so it
      # sits straight under the status and numbers; the chart and the explanation of why the room is
      # like this follow.
      - type: custom:pulse-card
        mode: scenes
        room: '[[room]]'
      - type: custom:pulse-card
        mode: device
        entity: '[[fan]]'
        decision: '[[fan_decision]]'
        label: '[[fan_label]]'
      # Only rooms with a temperature sensor chart: the numeric condition is false for a missing
      # entity, so gardens and the upstairs hallway show nothing here.
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: '[[temp]]'
            above: -100
        card:
          type: custom:apexcharts-card
          header:
            show: true
            title: Last 24 hours
            show_states: false
            colorize_states: false
          graph_span: 24h
          apex_config:
            chart:
              height: 170
              toolbar: {show: false}
              zoom: {enabled: false}
              background: '#1a1f26'
            legend:
              show: true
              position: bottom
              horizontalAlign: left
              fontSize: 11px
              labels: {colors: '#a3adba'}
              markers: {size: 5}
            dataLabels: {enabled: false}
            grid: {borderColor: '#232a33'}
            tooltip: {x: {format: HH:mm}}
            xaxis:
              type: datetime
              tickAmount: 4
              axisBorder: {show: false}
              axisTicks: {show: false}
              labels:
                datetimeUTC: false
                format: HH:mm
                style: {colors: '#8f9aa8', fontSize: 10px}
          # Two axes: temperature, and a hidden 0..1 axis so heat demand draws as a band along the bottom.
          # apexcharts-card forbids `yaxis` inside apex_config once this list is used.
          yaxis:
            - id: temp
              decimals: 0
              apex_config:
                labels:
                  style: {colors: '#8f9aa8', fontSize: 10px}
                  formatter: |
                    EVAL:function(value) {
                      return Math.round(value) + '°';
                    }
            - id: demand
              show: false
              min: 0
              max: 1
          card_mod:
            style: |
              ha-card { border: none; border-radius: 16px; box-shadow: none; background: #1a1f26; }
          series:
            - entity: '[[temp]]'
              name: Room
              yaxis_id: temp
              color: '#e8ebef'
              stroke_width: 2
              curve: smooth
              show: {legend_value: false}
            - entity: '[[climate]]'
              attribute: temperature
              name: Target
              yaxis_id: temp
              color: '#f2b84b'
              stroke_width: 2
              curve: stepline
              show: {legend_value: false}
            # hvac_action is the valve calling for heat. Unknown states (unavailable after a restart) map
            # to null so they leave a gap rather than read as "not heating".
            - entity: '[[climate]]'
              attribute: hvac_action
              name: Heating
              yaxis_id: demand
              type: area
              curve: stepline
              color: '#f08a4b'
              opacity: 0.3
              stroke_width: 0
              transform: "return x === 'heating' ? 1 : (x === 'idle' || x === 'off') ? 0 : null;"
              show: {legend_value: false}
      - type: custom:pulse-card
        mode: why
        room: '[[room]]'
      - type: custom:pulse-card
        mode: media
        room: '[[room]]'
      - type: custom:pulse-card
        mode: automations
        room: '[[room]]'
      - type: custom:pulse-card
        mode: room-feed
        room: '[[room]]'

# Garden page for the Pulse dashboard (views/info-room-front_garden.yaml, info-room-back_garden.yaml).
# A garden has no climate, presence report or individual scenes: the page shows one lights row, the
# theme picker (hidden when the garden has no theme helper) and why the garden is as it is.
# Variables:
#   room  garden key (front_garden or back_garden), see ROOMS in www/pulse-card.js
# Defaults live in `default`, not `variables:`: streamline-card ignores the latter.
pulse_garden:
  default:
    - room: ''
  card:
    type: vertical-stack
    cards:
      - type: custom:pulse-card
        mode: room-head
        room: '[[room]]'
      - type: custom:pulse-card
        mode: garden-lights
        room: '[[room]]'
      - type: custom:pulse-card
        mode: garden-theme
        room: '[[room]]'
      - type: custom:pulse-card
        mode: automations
        room: '[[room]]'
      - type: custom:pulse-card
        mode: room-feed
        room: '[[room]]'
