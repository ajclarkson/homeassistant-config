# Shared room page for the Pulse dashboard. One template, parameterised by room; every room view
# (views/info-room-*.yaml) is a single call to it. Sections that do not apply to a room (readings, heating, media,
# fan, scenes, individual lights) hide themselves, so there is no per-room card list to copy.
# The page reads top to bottom: header (back link, name, occupancy and lights, attention items), readings
# (temperature, light level), Scenes (with the Individual lights row), Heating (the day plan drawn by pulse-card, the mode grid, then the inset list),
# Presence (ending in the Automation row: the room's switches and tuning, inline), Media, the fan where a room has
# one, and Activity. Each section is a titled inset list built by pulse-card from the House page's parts.
#
# Variables:
#   room     key used by custom:pulse-card (see ROOMS in www/pulse-card.js) and by helper ids
#   climate, temp  no longer read: pulse-card takes the room's climate and temperature entities from ROOMS
#   fan, fan_decision, fan_label  optional fan row under the scenes: its switch, the decision sensor
#            whose reason explains it, and its title. Leave blank and the row hides itself.
# streamline-card takes defaults only from `default` (a list of single-key maps); a template-level
# `variables:` map is ignored, which left `[[fan]]` as literal text in rooms without a fan.
pulse_room:
  default:
    - room: ''
    - climate: ''
    - temp: ''
    - fan: ''
    - fan_decision: ''
    - fan_label: ''
  card:
    type: vertical-stack
    cards:
      - type: custom:pulse-card
        mode: room-head
        room: '[[room]]'
      - type: custom:pulse-card
        mode: readings
        room: '[[room]]'
      # Lights (scenes, then one row per light) is the control used most, so it sits straight under the readings.
      - type: custom:pulse-card
        mode: lights
        room: '[[room]]'
      - type: custom:pulse-card
        mode: heating
        room: '[[room]]'
      - type: custom:pulse-card
        mode: presence
        room: '[[room]]'
      - type: custom:pulse-card
        mode: media
        room: '[[room]]'
      - type: custom:pulse-card
        mode: device
        entity: '[[fan]]'
        decision: '[[fan_decision]]'
        label: '[[fan_label]]'
      - type: custom:pulse-card
        mode: room-feed
        room: '[[room]]'

# Garden page for the Pulse dashboard (views/info-room-front_garden.yaml, info-room-back_garden.yaml).
# A garden has no climate, presence report or individual scenes: the page shows one lights row, the
# theme picker (hidden when the garden has no theme helper), the garden's Automation switches and its Activity.
# Variables:
#   room  garden key (front_garden or back_garden), see ROOMS in www/pulse-card.js
# Defaults live in `default`, not `variables:`: streamline-card ignores the latter.
pulse_garden:
  default:
    - room: ''
  card:
    type: vertical-stack
    cards:
      - type: custom:pulse-card
        mode: room-head
        room: '[[room]]'
      - type: custom:pulse-card
        mode: garden-lights
        room: '[[room]]'
      - type: custom:pulse-card
        mode: garden-theme
        room: '[[room]]'
      - type: custom:pulse-card
        mode: automation
        room: '[[room]]'
      - type: custom:pulse-card
        mode: room-feed
        room: '[[room]]'
